<!doctype html>
<html lang="ja" data-app="dist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>見守り君(配布版)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="見守り君">
<meta name="theme-color" content="#2f6f5e">
<style>
/* ===== 色・形の基本(ライト/ダーク) ===== */
:root{
  --bg:#f2f4f1;--surface:#ffffff;--surface-2:#f6f8f5;--ink:#17201c;--sub:#5c6863;--faint:#8a948f;--line:#e1e6e2;
  --accent:#2f6f5e;--accent-ink:#ffffff;--accent-weak:#e3efe9;--accent-2:#c25d77;--accent-2-weak:#f8e7ec;
  --warn:#b4492c;--warn-weak:#fbe8e2;--top:#8f6200;--top-weak:#fbf0d2;
  --card:var(--surface);
  --shadow:0 1px 2px rgba(20,32,26,.05),0 8px 24px rgba(20,32,26,.05);
  --radius:16px;--topbar:69px;--sb:0px;
  --s1:#2f6f5e;--s2:#3b6fb6;--s3:#c0612b;--s4:#8a4fb0;--s5:#5f7d1f;--s6:#b03a5b;--s7:#4a4a4a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1311;--surface:#161c19;--surface-2:#1c2420;--ink:#e7ede9;--sub:#a2afa8;--faint:#7c8983;--line:#28312c;
  --accent:#6cc3a4;--accent-ink:#0b1712;--accent-weak:#1b3a2f;--accent-2:#ef9fb3;--accent-2-weak:#3a2229;
  --warn:#f08c6c;--warn-weak:#3a221b;--top:#e8bb4f;--top-weak:#3a3020;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --s1:#6cc3a4;--s2:#7fa8e8;--s3:#eb9a63;--s4:#c39ae0;--s5:#a9c766;--s6:#ec8fa9;--s7:#bbbbbb;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;font-size:16px;color:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 骨組み:左メニュー + 上の帯 + 本文(狭い画面では下のタブ) ===== */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.02em;padding:4px 8px}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo .mark svg.i{width:22px;height:22px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--sub);letter-spacing:.02em;line-height:1.3}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--sub);text-decoration:none;font-weight:600}
#nav a:hover{background:var(--surface-2);color:var(--ink)}
#nav a.on{background:var(--accent-weak);color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;line-height:1.5;color:var(--sub);display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}
.side-foot svg.i{width:18px;height:18px;color:var(--accent)}
.mainwrap{min-width:0}
header.top{position:sticky;top:0;z-index:15;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 24px;max-width:1228px;margin:0 auto}
.sharebar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:7px 16px;background:var(--warn);color:#fff;font-size:13px;font-weight:700}
.sharebar .sharesel{min-height:28px;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}
.sharebar .sharesel option{color:#17201c}
.sharebar button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
body.share{--sb:34px}
.juku{flex:1;min-width:0}
.topbar{flex-wrap:wrap}
.juku{flex:1 1 200px;min-width:170px}
.juku.jhs{flex:1 1 170px}
.juku.jhs .jlist{left:auto;right:0}
.juku.jhs .jsearch{max-width:none}
@media (max-width:640px){.juku{flex:1 1 0;min-width:0}.juku.jhs{flex:1 1 100%;order:3}.topbar{gap:8px}}
#jhsQ.nodata::placeholder{color:var(--faint)}
.jlist .jsec{padding:8px 14px 4px;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.04em;background:var(--surface-2);border-bottom:1px solid var(--line)}
.jsearch{position:relative;max-width:540px}
.jsearch .sicon{z-index:1;position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;width:18px;height:18px}
.jsearch input[type=search]{width:100%;height:44px;padding:0 40px 0 40px;border-radius:12px;background:var(--surface)}
.jsearch input[type=search].on{border-color:var(--accent);background:var(--accent-weak);font-weight:700;color:var(--accent)}
.jclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:20px;color:var(--sub);cursor:pointer;width:36px;height:36px;border-radius:10px}
.jclear:hover{background:var(--surface-2)}
.jlist{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(440px,92vw);max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(20,32,26,.16)}
.jlist button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:11px 14px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.jlist button:hover,.jlist button.cur{background:var(--accent-weak)}
.jlist button.back{color:var(--accent);font-size:14px;font-weight:600}
.jlist .jhead{padding:10px 14px 6px;font-size:12px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line);background:var(--surface-2)}
.jlist .cnt{color:var(--sub);font-size:13px;white-space:nowrap}
.jlist .none{padding:12px 14px;color:var(--sub);font-size:14px}
.top-actions{display:flex;gap:8px}
.share-btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.share-btn:hover{border-color:var(--accent)}
body.share #shareBtn{background:var(--warn);border-color:var(--warn);color:#fff}
main{max-width:1228px;margin:0 auto;padding:22px 24px 80px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--line);gap:0}
  .logo,.side-foot{display:none}
  #nav{flex-direction:row;flex:1;justify-content:space-around}
  #nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 12px}
  .topbar{padding:10px 16px}
  main{padding:16px 16px 110px}
  .share-btn .lbl-wide{display:none}
}

/* ===== 部品 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card > h2,.sec-title{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card > h2::before,.sec-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
h1{font-size:24px;line-height:1.3;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--sub)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 16px;min-height:42px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn);background:var(--warn-weak)}
.btn:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number],input[type=search],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:42px;color:var(--ink)}
select{max-width:100%}
select:focus,input:focus,textarea:focus{outline:3px solid var(--accent-weak);border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);vertical-align:-3px}
input[type=file]{font-size:14px;padding:12px;border:2px dashed var(--line);border-radius:14px;background:var(--surface-2);width:100%;max-width:560px;color:var(--sub)}
input[type=file]::file-selector-button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;margin-right:12px;font-weight:700;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--sub);font-weight:700}
.tile .v{font-size:24px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--accent-weak);color:var(--accent);white-space:nowrap;vertical-align:middle}
.badge.top{background:var(--top-weak);color:var(--top)}
.badge.off{background:var(--surface-2);color:var(--sub)}
.badge.warn{background:var(--warn-weak);color:var(--warn);margin-left:4px}
.notice{background:var(--warn-weak);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.up b{color:var(--accent)}
.chip.down b{color:var(--warn)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-size:12px;color:var(--sub);font-weight:700}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right}
tr.hl td{background:var(--accent-weak)}
tr.subrow td{color:var(--sub);font-size:13px}
tr.subrow td:first-child{padding-left:24px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--sub);font-size:11px}
.chart rect.hit{fill:transparent;cursor:crosshair}
.chart rect.hit:hover{fill:var(--ink);fill-opacity:.035}
.chart .guide{stroke:var(--sub);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.chart circle,.chart path{pointer-events:none}
#tip{position:fixed;z-index:1000;max-width:300px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:12px;line-height:1.45;pointer-events:none}
#tip .tip-h{font-weight:800;font-size:13px}
#tip .tip-n{color:var(--sub);font-size:11px}
#tip .tip-k{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--faint);font-size:10.5px;font-weight:700}
#tip .tip-row{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center;margin-top:3px}
#tip .tip-row i{width:9px;height:9px;border-radius:50%}
#tip .tip-row b{font-variant-numeric:tabular-nums}
.chart text.sub{fill:var(--sub);font-size:10.5px;font-weight:600}
.chart .grid{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:5px}
.legend button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600}
.legend button.off{opacity:.4}
.memo{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--surface)}
.memo .meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.memo p{margin:6px 0 0;white-space:pre-wrap}
.memo .pub{margin-top:10px;background:var(--accent-weak);border-radius:10px;padding:10px 12px}
.memo textarea{width:100%;margin-top:4px}
.memo-acts{margin-top:10px}
.memo-acts .btn{min-height:34px;padding:0 12px;font-size:13px}
.hidden-note{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--sub);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:0 14px;min-height:36px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.log{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px;white-space:pre-wrap}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:13px}
details > summary{cursor:pointer}
details.sheet > summary{list-style-position:inside;font-size:14px}
img.photo{object-fit:cover;border-radius:12px;background:var(--surface-2);flex:none}
.empty{text-align:center;padding:48px 16px;color:var(--sub)}
.stpick{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.stpick button{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--sub);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.stpick button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.stpick button.on:not(.all)::before{content:'✓ '}
.stpick button.all{border-style:dashed}
.stgroup{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--sub);font-weight:600}
.ja-filters .stpick button{min-height:34px}
.embed-warn{text-align:left;font-size:13px;line-height:1.6;background:var(--warn-weak);color:var(--ink);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.embed-warn b{color:var(--warn)}
#sheet{position:fixed;inset:0;z-index:45;overflow:auto;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#sheet[hidden],body.locked #sheet{display:none}
body.sheet-open{overflow:hidden}
body.sheet-open #fab{display:none}
.share-btn.on{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.sh-bar{max-width:1640px;width:100%;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-bar .btn{display:inline-flex;align-items:center;gap:4px}
.sh-bar .btn svg.i{width:16px;height:16px}
.sh-nav{display:flex;align-items:center;gap:8px}
.sh-nav [aria-disabled]{opacity:.35;pointer-events:none}
.sh-page{max-width:1640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 20px}
.sh-head{display:flex;gap:14px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sh-id{min-width:0;flex:1}
.sh-id h1{margin:2px 0;font-size:24px;line-height:1.2}
.sh-id .kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
.sh-page .kv .k{color:var(--sub);font-size:12px;font-weight:700;margin-right:6px}
.sh-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px;margin:10px 0}
.sh-kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.sh-kpi .k{font-size:12px;color:var(--sub);font-weight:700}
.sh-kpi .v{font-size:22px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.sh-kpi .v small{font-size:13px;color:var(--sub);font-weight:600}
.sh-kpi .d{font-size:12px;color:var(--sub);min-height:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-kpi.up .v{color:var(--accent)}
.sh-kpi.down .v{color:#c0392b}
.sh-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:'a b' 'c b';grid-template-rows:auto 1fr;gap:12px}
.sh-ca{grid-area:a}.sh-cb{grid-area:b}.sh-cc{grid-area:c}

@media (min-width:1200px){.sh-cols{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:'a b c';grid-template-rows:1fr}.sh-box .chart{max-height:260px}}
.sh-cols{align-items:stretch}
/* 画面の高さいっぱいに広げ、余った高さは伸びる枠(模試の記録・面談)に回す */
@media (min-width:681px){.sh-wrap{display:flex;flex-direction:column;transform-origin:top left}.sh-page{width:100%}.sh-page.has-fill{flex:1;display:flex;flex-direction:column}.sh-page.has-fill .sh-cols{flex:1}}
#sheet.sh-measure .sh-wrap{height:auto!important}
#sheet.sh-measure .sh-page.has-fill,#sheet.sh-measure .sh-page.has-fill .sh-cols{flex:none!important}
/* 一枚表示に切り替わったことが分かるように:上部バーを色付きに、開くときは下から浮き上がる */
.sh-bar{background:var(--accent);border-radius:16px;padding:6px 8px;box-shadow:var(--shadow)}
.sh-bar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.sh-bar .btn:hover{background:rgba(255,255,255,.24)}
.sh-bar .btn .muted,.sh-bar .muted{color:rgba(255,255,255,.75)!important}
.sh-bar .btn.on{background:#fff;color:var(--accent);border-color:#fff}
.sh-bar .btn.on .muted{color:var(--sub)!important}
.sh-mode{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:15px;padding:0 6px 0 4px}
.sh-mode svg.i{width:18px;height:18px}
#sheet{background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
@keyframes shFade{from{opacity:0}to{opacity:1}}
@keyframes shUp{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes shSwap{from{opacity:.35;transform:translateX(14px)}to{opacity:1;transform:none}}
#sheet.sh-enter{animation:shFade .22s ease-out}
#sheet.sh-enter .sh-page{animation:shUp .34s cubic-bezier(.2,.8,.2,1)}
#sheet.sh-enter .sh-bar{animation:shDown .3s ease-out}
#sheet.sh-switch .sh-page{animation:shSwap .26s ease-out}
#sheet.sh-leave{opacity:0;transition:opacity .18s ease-in}

<script>
/* 配布版(先生方用):<html data-app="dist">。生徒一覧(生徒カルテ・共有モード)だけを使う。データは配布ファイルで受け取る */
const DIST_APP = document.documentElement.dataset.app === 'dist';
/* 別のページに埋め込まれて開かれている(Google Apps Script など)か。iPadのSafariでは、埋め込みの中に保存したデータはアプリを閉じると消える */
const EMBEDDED = (() => { try { return window.self !== window.top; } catch { return true; } })();
const embedWarn = () => EMBEDDED ? `<div class="embed-warn"><b>この開き方では、データが残らないことがあります</b><br>今の見守り君は、別のページ(Google Apps Script など)の中に埋め込まれて表示されています。iPadでは、アプリを閉じる(タスクキルする)と取り込んだデータが消え、もう一度取り込みが必要になる場合があります。配った人に、データが残る開き方(アプリ専用のURL)を確認してください。</div>` : '';
const DB_NAME = DIST_APP ? 'mimamori-kun-dist' : 'mimamori-kun';
document.documentElement.classList.toggle('dist-app', DIST_APP);
'use strict';
/* ============ ユーティリティ ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === undefined || v === null || v === '') return null; const n = Number(String(v).replace(/[,，\s]/g, '')); return isFinite(n) ? n : null; };
const normDate = s => { const m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : String(s || ''); };
const shortDate = s => { const d = normDate(s); return d.length >= 7 ? `${d.slice(2,4)}/${d.slice(5,7)}` : d; };
const avg = a => { const b = a.filter(v => v !== null && v !== undefined && !isNaN(v)); return b.length ? b.reduce((x, y) => x + y, 0) / b.length : null; };
const f1 = v => v === null || v === undefined ? '—' : v.toFixed(1);
const signed = v => v === null || v === undefined ? '—' : (v > 0 ? '+' : '') + v.toFixed(1);
const jaSort = (a, b) => String(a).localeCompare(String(b), 'ja', { numeric: true });

/* ============ 保存(IndexedDB、失敗時はメモリのみ) ============ */
const store = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async rawGet(k) {
    try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (e) { console.warn(e); return undefined; }
  },
  async rawSet(k, v) {
    try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
    catch (e) { console.warn(e); return false; }
  },
  // 'vault'(鍵の情報)以外はすべて暗号化して保存する
  async get(k) { const r = await this.rawGet(k); return r && r.__enc ? decryptValue(r) : r; },
  async set(k, v) { if (!VAULT.key) { console.warn('locked'); return false; } try { return await this.rawSet(k, await encryptValue(v)); } catch (e) { console.warn(e); return false; } },
};

/* ============ 暗号化(パスコード → PBKDF2 → AES-GCM。ブラウザ標準の WebCrypto のみ使用) ============ */
const VAULT = { key: null, meta: null };
const ENC_KEYS = ['data', 'settings', 'mappings', 'memoEdits', 'extra', 'photos', 'linkOff', 'memoEditsBase', 'extraBase'];
const PBKDF2_ITER = 310000;
const b2u8 = b => new Uint8Array(b);
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function enc(buf, key = VAULT.key) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, ct: await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buf) }; }
async function dec(x, key = VAULT.key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u8(x.iv) }, key, x.ct); }
async function encryptValue(v) {
  if (v && typeof v === 'object' && Object.values(v).some(x => x instanceof Blob)) { // 写真(Blob)は1枚ずつ暗号化
    const items = {}; for (const [id, b] of Object.entries(v)) items[id] = { ...(await enc(await b.arrayBuffer())), type: b.type };
    return { __enc: 2, items };
  }
  return { __enc: 1, ...(await enc(new TextEncoder().encode(JSON.stringify(v ?? null)))) };
}
async function decryptValue(r) {
  if (r.__enc === 2) { const out = {}; for (const [id, x] of Object.entries(r.items)) out[id] = new Blob([await dec(x)], { type: x.type || 'image/jpeg' }); return out; }
  return JSON.parse(new TextDecoder().decode(await dec(r)));
}

/* ============ CSV ============ */
function parseRows(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim()));
}
function toCSV(cols, rows) {
  const q = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
}
async function readFileText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('shift_jis').decode(buf); } // Excel(Shift_JIS)書き出し対策
}

/* ============ xlsx 読み込み(端末内で展開。外部ライブラリなし) ============ */
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('xlsx形式ではありません');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = new Map();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    files.set(name, { method, data: u8.subarray(start, start + csize) });
    p += 46 + nl + el + cl;
  }
  return async name => {
    const f = files.get(name); if (!f) return null;
    if (f.method === 0) return dec.decode(f.data);
    if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザはxlsxの読み込みに対応していません(iPadOS 16.4 以降が必要です)');
    const out = await new Response(new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return dec.decode(out);
  };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const tags = (el, t) => [...el.getElementsByTagNameNS('*', t)];
const colIndex = ref => { const m = /^([A-Z]+)/.exec(ref || ''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
async function readXlsx(buf) {
  const get = await unzip(buf);
  const wbTxt = await get('xl/workbook.xml'); if (!wbTxt) throw new Error('ブックの情報が見つかりません');
  const rels = new Map(tags(xmlDoc(await get('xl/_rels/workbook.xml.rels') || '<r/>'), 'Relationship').map(r => [r.getAttribute('Id'), r.getAttribute('Target')]));
  const ssTxt = await get('xl/sharedStrings.xml');
  // ふりがな(rPh)は除外する
  const ss = ssTxt ? tags(xmlDoc(ssTxt), 'si').map(si => tags(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')) : [];
  const sheets = [];
  for (const sh of tags(xmlDoc(wbTxt), 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = rels.get(rid); if (!target) continue;
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
    const txt = await get(target); if (!txt) continue;
    const rows = [];
    for (const row of tags(xmlDoc(txt), 'row')) {
      const ri = Number(row.getAttribute('r')) - 1; const arr = [];
      tags(row, 'c').forEach((c, j) => {
        const ci = c.getAttribute('r') ? colIndex(c.getAttribute('r')) : j;
        const t = c.getAttribute('t'); const v = tags(c, 'v')[0]?.textContent ?? '';
        arr[ci] = t === 's' ? (ss[Number(v)] ?? '') : t === 'inlineStr' ? tags(c, 't').map(x => x.textContent).join('') : t === 'e' ? '' : v;
      });
      rows[ri >= 0 ? ri : rows.length] = arr;
    }
    sheets.push({ name: sh.getAttribute('name'), rows: Array.from(rows, r => Array.from(r || [], x => String(x ?? '').trim())) });
  }
  return sheets;
}

/* ============ .xls 読み込み(Excel 97-2003 形式。端末内で処理、外部ライブラリなし) ============ */
function readCFB(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  const ssz = 1 << dv.getUint16(30, true), mssz = 1 << dv.getUint16(32, true);
  const sec = n => 512 + n * ssz;
  const END = 0xFFFFFFFA;
  const difat = [];
  for (let i = 0; i < 109; i++) { const v = dv.getUint32(76 + i * 4, true); if (v < END) difat.push(v); }
  let ds = dv.getUint32(68, true), nd = dv.getUint32(72, true);
  while (nd-- > 0 && ds < END) {
    const per = ssz / 4 - 1;
    for (let i = 0; i < per; i++) { const v = dv.getUint32(sec(ds) + i * 4, true); if (v < END) difat.push(v); }
    ds = dv.getUint32(sec(ds) + per * 4, true);
  }
  const fat = []; for (const f of difat) for (let i = 0; i < ssz / 4; i++) fat.push(dv.getUint32(sec(f) + i * 4, true));
  const chain = (start, table) => { const out = []; let s = start, guard = 0; while (s < END && guard++ < 1e6) { out.push(s); s = table[s]; } return out; };
  const readStream = (start, size) => {
    const out = new Uint8Array(size); let o = 0;
    for (const s of chain(start, fat)) { const n = Math.min(ssz, size - o); if (n <= 0) break; out.set(u8.subarray(sec(s), sec(s) + n), o); o += n; }
    return out;
  };
  const dirs = [];
  for (const s of chain(dv.getUint32(48, true), fat)) for (let k = 0; k < ssz / 128; k++) {
    const p = sec(s) + k * 128, nl = dv.getUint16(p + 64, true);
    dirs.push({ name: new TextDecoder('utf-16le').decode(u8.subarray(p, p + Math.max(0, nl - 2))), type: u8[p + 66], start: dv.getUint32(p + 116, true), size: dv.getUint32(p + 120, true) });
  }
  const cutoff = dv.getUint32(56, true);
  return name => {
    const d = dirs.find(x => x.type === 2 && x.name === name); if (!d) return null;
    if (d.size >= cutoff) return readStream(d.start, d.size);
    const mini = readStream(dirs[0].start, dirs[0].size);
    const mf = readStream(dv.getUint32(60, true), dv.getUint32(64, true) * ssz), mv = new DataView(mf.buffer);
    const mfat = []; for (let i = 0; i < mf.length / 4; i++) mfat.push(mv.getUint32(i * 4, true));
    const out = new Uint8Array(d.size); let o = 0;
    for (const s of chain(d.start, mfat)) { const n = Math.min(mssz, d.size - o); if (n <= 0) break; out.set(mini.subarray(s * mssz, s * mssz + n), o); o += n; }
    return out;
  };
}
function readXls(buf) {
  const get = readCFB(buf);
  const wb = get('Workbook') || get('Book');
  if (!wb) throw new Error('Excelのブックが見つかりません');
  const dv = new DataView(wb.buffer, wb.byteOffset, wb.byteLength);
  const u16 = p => dv.getUint16(p, true), u32 = p => dv.getUint32(p, true);
  const recs = [];
  for (let p = 0; p + 4 <= wb.length;) { const t = u16(p), n = u16(p + 2); recs.push({ t, p: p + 4, n }); p += 4 + n; }
  if (recs[0]?.t !== 0x0809 || u16(recs[0].p) !== 0x0600) throw new Error('Excel 95 以前の古い形式には対応していません。Excelで「.xlsx」として保存し直してください');
  const dec16 = new TextDecoder('utf-16le');
  const chars = (p, n, wide) => { if (wide) return dec16.decode(wb.subarray(p, p + n * 2)); let s = ''; for (let k = 0; k < n; k++) s += String.fromCharCode(wb[p + k]); return s; };
  const numStr = x => String(Number(x.toPrecision(15)));
  const rk = v => { let x; if (v & 2) x = v >> 2; else { const t = new DataView(new ArrayBuffer(8)); t.setUint32(4, v & 0xFFFFFFFC, true); x = t.getFloat64(0, true); } return v & 1 ? x / 100 : x; };
  const sheets = [], sst = [];
  const readSST = segs => {
    let si = 0, p = segs[0][0] + 8;
    const ok = () => { while (si < segs.length && p >= segs[si][1]) { si++; if (si < segs.length) p = segs[si][0]; } return si < segs.length; };
    const b = () => (ok() ? wb[p++] : 0);
    const w = () => b() | (b() << 8);
    const count = u32(segs[0][0] + 4);
    for (let k = 0; k < count && ok(); k++) {
      const cch = w(); let fl = b(), runs = 0, ext = 0;
      if (fl & 8) runs = w();
      if (fl & 4) ext = (w() | (w() << 16)) >>> 0;

function lineChart(o) {
  const sub = o.cats.some(c => c.sub), W = 640, H = (o.h || 230) + (sub ? 14 : 0), L = 38, R = 14, T = 12, B = sub ? 48 : 34;

  const step = Math.ceil(n / 7);
  o.cats.forEach((c, i) => { if (i % step === 0 || i === n - 1) { const an = n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle'; g += `<text x="${xs(i)}" y="${H - B + 18}" text-anchor="${an}">${esc(c.short)}</text>${c.sub ? `<text class="sub" x="${xs(i)}" y="${H - B + 33}" text-anchor="${an}">${esc(c.sub)}</text>` : ''}`; } });
  for (const s of o.series) {
    // 受けていない回(値なし)があっても、前後の回を線でつなぐ。とばした区間は点線にする
    let d = '', gap = '', prev = null, skipped = false, pts = '';
    s.values.forEach((v, i) => {
      if (v === null || v === undefined) { skipped = true; return; }
      const pt = `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`;
      if (prev && skipped) { gap += `M${prev}L${pt}`; d += `M${pt}`; } else d += `${prev ? 'L' : 'M'}${pt}`;
      prev = pt; skipped = false;
      pts += `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="${s.bold ? 4 : 3}" fill="${s.color}"><title>${esc(o.cats[i].full)} / ${esc(s.name)}: ${esc(fmt(v))}</title></circle>`;
    });
    if (gap) g += `<path d="${gap}" fill="none" stroke="${s.color}" stroke-width="${s.bold ? 2.2 : 1.4}" stroke-dasharray="5 4" stroke-linecap="round" opacity=".75"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold ? 2.6 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
  }
  // 列にカーソルを合わせる(iPadはタップ)と、その列が何の回か・各線の値を表示
  const cw = n === 1 ? W - L - R : (W - L - R) / (n - 1);

  o.cats.forEach((c, i) => {
    const vals = o.series.map(s => { const v = s.values[i]; return `<div class="tip-row"><i style="background:${s.color}"></i><span>${esc(s.name)}</span><b>${v === null || v === undefined ? '<span class="muted">なし</span>' : esc(fmt(v))}</b></div>`; }).join('');
    const tip = `<div class="tip-h">${esc(c.full || c.short)}</div>${(c.notes || []).map(t => `<div class="tip-n">${esc(t)}</div>`).join('')}${o.label ? `<div class="tip-k">${esc(o.label)}</div>` : ''}${vals}`;
    g += `<rect class="hit" x="${(xs(i) - cw / 2).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" data-gx="${xs(i).toFixed(1)}" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'グラフ')}">${g}</svg>`;
}

function bindList() {
  const on = (id, k, ev = 'change') => { const el = $(id); if (el) el.addEventListener(ev, () => { UI[k] = el.value; render(); }); };

  const fq = $('#fQ');
  if (fq) {
    let composing = false, timer = 0;
    const apply = () => { clearTimeout(timer); timer = setTimeout(() => {
      if (composing || UI.q === fq.value) return;
      UI.q = fq.value; const pos = fq.selectionStart; render();
      const n = $('#fQ'); if (n) { n.focus({ preventScroll: true }); try { n.setSelectionRange(pos, pos); } catch {} }
    }, 250); };
    fq.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
    fq.addEventListener('compositionend', () => { composing = false; apply(); });
    fq.addEventListener('input', e => { if (composing || e.isComposing) return; apply(); });
    fq.addEventListener('search', apply); // ×ボタンで消したとき
  }

async function handleFiles(files) {
  const log = [];
  const ok = f => /\.(xlsx|xls|csv)$/i.test(f.name) && !/^(~\$|\.)/.test(f.name);
  const skipped = files.filter(f => !ok(f)); files = files.filter(ok);
  if (files.length > 1 && files.some(f => f.webkitRelativePath)) log.push(`フォルダから ${files.length}件のファイルを読み込みます`);
  let done = 0;
  importLog = `読み込み中… 0 / ${files.length}件`; render(true);
  for (const f of files) {
    importLog = `読み込み中… ${++done} / ${files.length}件:${f.name}`; const pg = $('#impProg'); if (pg) pg.textContent = importLog;
    await new Promise(r => setTimeout(r, 0)); // 画面に進み具合を出す
    try {
      const sheets = await readAnySheets(f);
      let k = 0;
      for (const s of sheets) {
        const rows = s.rows.map(r => r || []);
        if (!rows.some(r => r.some(x => x))) continue;
        PENDING = PENDING.filter(p => !(p.file === f.name && p.name === s.name)); // 同じファイル名・シートは新しい方に置き換え
        const sh = { file: f.name, name: s.name, rows, headerRow: 1, twoRow: false, use: false, roles: {}, fixed: {}, open: false, sample: false };
        applyMap(sh); PENDING.push(sh); k++;
      }
      if (PENDING.some(p => p.file === f.name && p.kind === 'mimamori')) PENDING.forEach(p => { if (p.file === f.name && !p.kind && !p.fromSaved) p.use = false; });
      log.push(`✓ ${f.name}: ${k}シート`);
    } catch (e) { log.push(`✕ ${f.name}: 読み込めませんでした(${e.message})`); }
  }
  if (skipped.length) log.push(`(Excel・CSV以外のファイルや一時ファイル ${skipped.length}件は飛ばしました)`);
  if (!files.length && !skipped.length) log.push('ファイルが選ばれていません');
  importLog = log.join('\n'); render(true);
}

      if (x.type === 'info') return `<div class="none">${esc(x.text)}</div>`;
      if (x.type === 'sec') return `<div class="jsec">${esc(x.text)}</div>`;
      const lab = x.type === 'back' ? `← ${esc(o.groupWord)}の一覧に戻る` : x.type === 'all' ? `<b>${esc(o.allText(x.g))}</b>`
        : x.type === 'item' ? `${esc(x.i)}${x.note ? `<div class="small muted">${esc(x.g)}</div>` : ''}` : esc(x.g);
      const right = x.type === 'back' ? '' : x.type === 'group' ? `${x.n}名${x.m ? ` ・ ${x.m}${o.itemUnit} ›` : ''}` : `${x.n}名`;
      return `<button type="button" data-i="${n}" class="${n === cur ? 'cur ' : ''}${x.type === 'back' ? 'back' : ''}"><span>${lab}</span><span class="cnt">${right}</span></button>`;
    }).join('') : `<div class="none">${esc(step ? o.none2 : typeof o.none1 === 'function' ? o.none1() : o.none1)}</div>`);
    box.hidden = false;
  };
  P.pick = (g, i) => { step = ''; o.set(g, i); box.hidden = true; P.fill(); q.blur(); UI.listY = 0; UI.lastSeen = ''; if (location.hash.startsWith('#student')) location.hash = '#list'; else render(); };

  document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target) && !box.hidden) close(); });

  return P;
}

  for (const k of ENC_KEYS) await store.rawSet(k, pkg.items[k] ?? undefined);
  await store.rawSet('vault', { ...pkg.vault, fails: 0, waitUntil: 0 });
  return '';
}
function restoreScreen(back) {
  showLockScreen(`<h1>バックアップから復元</h1><p class="small">「見守り君バックアップ_….mimamori」ファイルを選び、<b>バックアップを書き出したときのパスコード</b>を入力してください。<br>この端末の今のデータは、バックアップの内容に置き換わります。</p>
    <input type="file" id="bkFile" accept=".mimamori,application/octet-stream,application/json" style="font-size:16px;letter-spacing:0">
    <input type="password" id="bkPass" placeholder="パスコード" autocomplete="off">
    <div class="err" id="perr"></div><button class="btn primary" id="bkGo">復元する</button>
    <p style="margin-top:20px"><a href="#" id="bkBack" class="small">戻る</a></p>`);
  $('#bkBack').addEventListener('click', e => { e.preventDefault(); back(); });
  $('#bkGo').addEventListener('click', async () => {
    const f = $('#bkFile').files[0]; if (!f) { $('#perr').textContent = 'ファイルを選んでください'; return; }
    $('#bkGo').disabled = true; $('#perr').textContent = '確認中…';
    try {
      const pkg = await readBackup(f);
      const err = await restoreBackup(pkg, $('#bkPass').value);
      if (err) { $('#perr').textContent = err; $('#bkGo').disabled = false; return; }
      $('#perr').textContent = '復元しました。パスコードで開いてください。'; setTimeout(() => location.reload(), 800);
    } catch (e) { $('#perr').textContent = e.message; $('#bkGo').disabled = false; }
  });
}
/* ============ 配布ファイル(先生方に配る用) ============
   アプリ本体には生徒データが入っていないので、データは「配布ファイル」1つで渡す。
   配布用パスワード(自分のパスコードとは別)で暗号化。受け取った人は自分のパスコードを決めて使う */
async function exportDist(o) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(o.pass, salt, PBKDF2_ITER), te = new TextEncoder();
  const data = JSON.parse(JSON.stringify(DATA));
  if (!o.incMemo) { data.interviews = []; Object.values(data.sources || {}).forEach(x => { x.recs = x.recs.filter(r => r.type !== 'interviews'); }); }
  const pick = ['rankMode', 'rankCount', 'rankRatio', 'share', 'gradGrade', 'gradePrefix', 'autoLockMin'];
  const extra = { edits: o.incMemo ? { ...EDITS_BASE, ...EDITS } : {}, extra: { ...EXTRA_BASE, ...EXTRA }, settings: Object.fromEntries(pick.filter(k => SETTINGS[k] !== undefined).map(k => [k, SETTINGS[k]])), linkOff: [...LINKOFF], mappings: MAPS };
  const payload = { data: await enc(te.encode(JSON.stringify(data)), key), extra: await enc(te.encode(JSON.stringify(extra)), key), photos: {} };
  if (o.incPhoto) for (const [id, b] of Object.entries(PHOTOS)) payload.photos[id] = { ...(await enc(await b.arrayBuffer(), key)), type: b.type };
  const pkg = { format: 'mimamori-dist', v: 1, createdAt: new Date().toISOString(), label: o.label, includes: { memo: !!o.incMemo, photo: !!o.incPhoto }, counts: { students: DATA.students.length, photos: o.incPhoto ? Object.keys(PHOTOS).length : 0 }, kdf: { salt, iter: PBKDF2_ITER }, check: await enc(te.encode('mimamori-dist-ok'), key), payload };
  const blob = new Blob([JSON.stringify(packBin(pkg))], { type: 'application/octet-stream' });
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `見守り君_配布_${(o.label || '').replace(/[\\/:*?"<>|\s]/g, '') || ymd}_${ymd}.mimamori`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return blob.size;
}
async function openDist(file, pass) {
  let pkg; try { pkg = unpackBin(JSON.parse(await file.text())); } catch { throw new Error('配布ファイルとして読めません'); }
  if (pkg.format !== 'mimamori-dist') throw new Error(pkg.format === 'mimamori-backup' ? 'これは個人用のバックアップファイルです(「バックアップから復元」で使います)' : '見守り君の配布ファイルではありません');
  const key = await deriveKey(pass, b2u8(pkg.kdf.salt), pkg.kdf.iter), td = new TextDecoder();
  try { if (td.decode(await dec(pkg.check, key)) !== 'mimamori-dist-ok') throw 0; } catch { throw new Error('配布用パスワードが違います'); }
  const data = JSON.parse(td.decode(await dec(pkg.payload.data, key)));
  const extra = JSON.parse(td.decode(await dec(pkg.payload.extra, key)));
  const photos = {}; for (const [id, x] of Object.entries(pkg.payload.photos || {})) photos[id] = new Blob([await dec(x, key)], { type: x.type || 'image/jpeg' });
  return { meta: { label: pkg.label || '', createdAt: pkg.createdAt, includes: pkg.includes || {}, counts: pkg.counts || {} }, data, extra, photos };
}
/* 反映:配布データは置き換え、この端末の人が自分で入力した内容(面談の公開設定・進学先・設定)は残す */
async function applyDist(d) {
  DATA = d.data; DATA.importedAt = `配布データ「${d.meta.label || '無題'}」`;
  if (d.meta.includes.photo) PHOTOS = d.photos;
  EDITS_BASE = d.extra.edits || {}; EXTRA_BASE = d.extra.extra || {};
  if (!SETTINGS.distApplied) { SETTINGS = { ...SETTINGS, ...(d.extra.settings || {}), distApplied: true }; } // 設定は初回だけ配布元に合わせる
  LINKOFF = new Set([...LINKOFF, ...(d.extra.linkOff || [])]);
  MAPS = { ...(d.extra.mappings || {}), ...MAPS };
  SETTINGS.dist = { label: d.meta.label, createdAt: d.meta.createdAt, importedAt: new Date().toLocaleString('ja-JP'), includes: d.meta.includes };
  for (const [k, v] of [['data', DATA], ['photos', PHOTOS], ['memoEditsBase', EDITS_BASE], ['extraBase', EXTRA_BASE], ['settings', SETTINGS], ['linkOff', [...LINKOFF]], ['mappings', MAPS]]) await store.set(k, v);
  if (DATA.sources && Object.keys(DATA.sources).length && DATA.mergeVer !== MERGE_VER) await rebuildFromSources(DATA.importedAt);
  reindex(); fillJuku(); applyShare();
}
const distLabelText = m => `「${m.label || '無題'}」(${new Date(m.createdAt).toLocaleDateString('ja-JP')} 作成)`;
/* 初めて開いた端末:配布ファイルから始める(自分のパスコードもここで決める) */
function distStartScreen() {
  showLockScreen(`${embedWarn()}<h1>配布ファイルから始める</h1><p class="small">受け取った「見守り君_配布_….mimamori」ファイルと、<b>配布用パスワード</b>(配った人から聞いたもの)を入力してください。<br>あわせて、この端末で使う<b>自分のパスコード</b>を決めます。</p>
    <input type="file" id="dsFile" accept=".mimamori,application/octet-stream,application/json" style="font-size:16px;letter-spacing:0">
    <input type="password" id="dsPass" placeholder="配布用パスワード" autocomplete="off">
    <input type="password" id="dsP1" placeholder="自分のパスコード(6文字以上)" autocomplete="new-password">
    <input type="password" id="dsP2" placeholder="自分のパスコード(もう一度)" autocomplete="new-password">
    <div class="err" id="perr"></div><button class="btn primary" id="dsGo">取り込んで始める</button>
    <p style="margin-top:20px"><a href="#" id="dsBack" class="small">${DIST_APP ? '自分のバックアップファイルから復元する' : '戻る'}</a></p>`);
  $('#dsBack').addEventListener('click', e => { e.preventDefault(); DIST_APP ? restoreScreen(distStartScreen) : setupScreen(); });
  $('#dsGo').addEventListener('click', async () => {
    const f = $('#dsFile').files[0], a = $('#dsP1').value;
    if (!f) { $('#perr').textContent = '配布ファイルを選んでください'; return; }
    if (a.length < 6) { $('#perr').textContent = '自分のパスコードは6文字以上にしてください'; return; }
    if (a !== $('#dsP2').value) { $('#perr').textContent = '自分のパスコードが一致しません'; return; }
    $('#dsGo').disabled = true; $('#perr').textContent = '確認中…(データが多いと少し時間がかかります)';
    try {
      const d = await openDist(f, $('#dsPass').value);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      VAULT.key = await deriveKey(a, salt, PBKDF2_ITER);
      VAULT.meta = { v: 1, salt, iter: PBKDF2_ITER, check: await enc(new TextEncoder().encode('mimamori-ok')), fails: 0, waitUntil: 0 };
      await store.rawSet('vault', VAULT.meta);
      await startApp(); await applyDist(d); location.hash = '#list'; render();
    } catch (e) { $('#perr').textContent = e.message; $('#dsGo').disabled = false; }
  });
}
async function startApp() {
  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch {} // 保存データを自動で消さないよう申請
  document.body.classList.remove('locked'); lockEl().hidden = true; lockEl().innerHTML = ''; lastAct = Date.now();
  const d = await store.get('data'); if (d && d.students) DATA = d;
  const st = await store.get('settings'); if (st) SETTINGS = { ...SETTINGS, ...st };
  if (!SETTINGS.share) SETTINGS.share = SETTINGS.photoInShare ? { preset: 'custom', custom: { ...SHARE_PRESETS.standard, label: undefined, photo: true } } : { preset: 'standard' };
  MAPS = (await store.get('mappings')) || {};
  EDITS = (await store.get('memoEdits')) || {};
  EXTRA = (await store.get('extra')) || {};
  EDITS_BASE = (await store.get('memoEditsBase')) || {}; EXTRA_BASE = (await store.get('extraBase')) || {};
  LINKOFF = new Set((await store.get('linkOff')) || []);
  PHOTOS = (await store.get('photos')) || {};
  LINKOFF = new Set((await store.get('linkOff')) || LINKOFF);
  if (DATA.sources && Object.keys(DATA.sources).length && DATA.mergeVer !== MERGE_VER) { try { await rebuildFromSources(DATA.importedAt || new Date().toLocaleString('ja-JP')); } catch (e) { console.warn(e); } } // 照合のしかたが新しくなっていたら自動で照合し直す
  reindex(); fillJuku(); applyShare(); render();
}
document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, el.className); });
$('#logoMark').innerHTML = icon('logo');
$('#lockBtn').addEventListener('click', () => {
  if (!location.hash.startsWith('#student/')) return lockNow();
  if (UI.sheet) return hideSheet();
  UI.sheet = true; showSheet(decodeURIComponent(location.hash.split('/')[1] || '')); updateTopBtn();
});
$('#shareOff').addEventListener('click', () => $('#shareBtn').click());
$('#sharePreset').addEventListener('change', async e => { SETTINGS.share = { ...(SETTINGS.share || {}), preset: e.target.value }; await store.set('settings', SETTINGS); applyShare(); render(true); });
// オフライン起動用(Webに置いて開いた場合のみ。ファイルを直接開いた場合は何もしない)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e => console.warn(e));
boot();
</script>
